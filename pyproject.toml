[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-highlights"
version = "0.1.0"
description = "Local CS2 demo-to-highlights pipeline using CS Demo Manager"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cs-highlights = "cs_highlights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
